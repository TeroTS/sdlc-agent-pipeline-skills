version: 1

stories:
  - id: S001
    title: Create implement-story skill
    status: done
    dependsOn: []
    goal: Developers can select and implement exactly one dependency-ready backlog story.
    scope:
      include:
        - implement-story skill and agent definition
        - Backlog story selection and status-transition rules
        - Contract-reference and required-test enforcement
      exclude:
        - Automatic commits or pushes
        - Backlog story creation or reordering
        - Multi-story implementation
    contractRefs: []
    acceptanceCriteria:
      - The skill resumes the sole active story or selects the first dependency-ready pending story.
      - A named story is implemented only when dependency-ready.
      - The selected story becomes active before implementation and done only after required checks pass.
      - A failed check leaves the selected story active and stops further implementation.
    requiredTests:
      - Validate backlog selection rules for active, pending, blocked, and named stories.
      - Verify invalid or ambiguous backlog states stop without implementation.
      - Verify completion and failure status-transition rules.
    definitionOfDone:
      - Required tests pass.
      - The skill implements no more than one story per invocation.
      - The skill does not commit or push automatically.
